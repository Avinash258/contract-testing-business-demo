x-env: &service-env
  URL_CEM: http://cem:4201
  URL_MAD: http://mad:4202
  URL_CAM: http://cam:4203
  URL_TIM: http://tim:4204
  URL_RPAM: http://rpam:4205
  URL_FORMS: http://forms-print:4206

services:
  cem:
    build: .
    command: node services/cem/index.js
    environment:
      <<: *service-env
    ports:
      - "4201:4201"

  mad:
    build: .
    command: node services/mad/index.js
    environment:
      <<: *service-env
    ports:
      - "4202:4202"

  cam:
    build: .
    command: node services/cam/index.js
    environment:
      <<: *service-env
    ports:
      - "4203:4203"

  tim:
    build: .
    command: node services/tim/index.js
    environment:
      <<: *service-env
    ports:
      - "4204:4204"

  rpam:
    build: .
    command: node services/rpam/index.js
    environment:
      <<: *service-env
    ports:
      - "4205:4205"

  forms-print:
    build: .
    command: node services/forms-print/index.js
    environment:
      <<: *service-env
    ports:
      - "4206:4206"

  gateway:
    build: .
    command: node gateway/index.js
    environment:
      <<: *service-env
      GATEWAY_PORT: 4200
    ports:
      - "4200:4200"
    depends_on:
      - cem
      - mad
      - cam
      - tim
      - rpam
      - forms-print
